<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>DigiPOS Dashboard — Historical Monthly Performance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --navy:#0B1F44; --navy-2:#14294F; --navy-soft:#EEF1F6;
    --red:#E4002B; --red-soft:#FFE9ED;
    --bg:#F1F2F6; --card:#FFFFFF; --ink:#0B1F44; --ink-soft:#6B7686; --line:#E7E9EE;
    --pos:#158A5E; --pos-soft:#E4F6EE; --neg:#E4002B; --neg-soft:#FFE9ED;
    --ly:#F4C3CD; --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased;}
  button{font-family:inherit; cursor:pointer;}
  .app{max-width:460px; margin:0 auto; min-height:100vh; background:var(--bg); padding-bottom:36px;}

  /* Header */
  header.top{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%); color:#fff; padding:22px 20px 20px; position:relative; overflow:hidden;}
  header.top::after{content:""; position:absolute; right:-40px; top:-40px; width:160px; height:160px; border-radius:50%; border:1.5px dashed rgba(255,255,255,0.18);}
  header.top::before{content:""; position:absolute; right:10px; bottom:-60px; width:130px; height:130px; border-radius:50%; border:1.5px dashed rgba(255,255,255,0.12);}
  .brand-row{display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1; gap:10px;}
  .brand-lockup{display:flex; align-items:center; gap:10px;}
  .brand-logo{height:32px; width:auto; display:block;}
  .brand-title{font-size:18px; font-weight:800; color:#fff; letter-spacing:0.1px; line-height:1.15;}
  .period-chip{font-size:11px; color:rgba(255,255,255,0.85); border:1px solid rgba(255,255,255,0.3); padding:4px 10px; border-radius:20px; white-space:nowrap; flex-shrink:0;}
  .subtitle{font-size:12.5px; color:rgba(255,255,255,0.75); margin-top:12px; position:relative; z-index:1;}
  .cross-nav-link{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; color:rgba(255,255,255,0.9); border:1px solid rgba(255,255,255,0.3); padding:5px 12px; border-radius:20px; margin-top:12px; text-decoration:none; position:relative; z-index:1;}

  /* Page switcher (MTD vs Historical) — sama dengan Roaming Performance */
  .page-switch{display:flex; gap:8px; padding:14px 16px 4px;}
  .page-switch a{
    flex:1; font-size:12.5px; font-weight:700; padding:11px 10px; border-radius:14px; text-align:center; text-decoration:none;
    border:1.5px solid var(--line); background:#fff; color:var(--ink-soft);
  }
  .page-switch a.active{background:var(--navy); color:#fff; border-color:var(--navy);}

  /* Tabs */
  nav.tabs{display:flex; gap:6px; padding:10px 14px; background:var(--bg); position:sticky; top:0; z-index:20; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--line);}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{flex:0 0 auto; font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:20px; border:1px solid var(--line); background:#fff; color:var(--ink-soft); white-space:nowrap;}
  nav.tabs button.active{background:var(--navy); color:#fff; border-color:var(--navy);}

  section{padding:18px 16px 4px; scroll-margin-top:60px;}
  .sec-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:12px;}
  .sec-title{font-size:15px; font-weight:700; color:var(--navy); margin-bottom:2px;}
  .sec-sub{font-size:11.5px; color:var(--ink-soft);}
  .pill-btn{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--navy); background:#fff; border:1px solid var(--line); padding:7px 14px; border-radius:20px; white-space:nowrap; flex-shrink:0; box-shadow:0 1px 2px rgba(11,31,68,0.05);}
  .pill-btn svg{width:13px; height:13px;}
  .pill-btn.on{border-color:var(--red); color:var(--red);}

  /* YoY pill */
  .yoy{display:inline-flex; align-items:center; gap:3px; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:20px; white-space:nowrap;}
  .yoy.pos{color:var(--pos); background:var(--pos-soft);}
  .yoy.neg{color:var(--neg); background:var(--neg-soft);}
  .yoy.flat{color:var(--ink-soft); background:var(--navy-soft);}

  /* Boarding-pass KPI card */
  .kpi-card{background:var(--card); border-radius:var(--radius); margin-bottom:14px; box-shadow:0 1px 3px rgba(11,31,68,0.06); position:relative; overflow:hidden;}
  .kpi-main{padding:16px 18px 14px; display:flex; align-items:flex-start; justify-content:space-between;}
  .kpi-label{font-size:12px; color:var(--ink-soft); font-weight:600;}
  .kpi-value{font-size:26px; font-weight:800; margin-top:4px; font-variant-numeric:tabular-nums;}
  .stub-divider{position:relative; height:1px; margin:0 18px; border-top:1.5px dashed var(--line);}
  .stub-divider::before,.stub-divider::after{content:""; position:absolute; top:-8px; width:16px; height:16px; border-radius:50%; background:var(--bg);}
  .stub-divider::before{left:-26px;} .stub-divider::after{right:-26px;}
  .kpi-breakdown{display:flex; padding:12px 18px 14px;}
  .kpi-break-item{flex:1; min-width:0;}
  .kpi-break-item + .kpi-break-item{border-left:1px solid var(--line); padding-left:14px; margin-left:14px;}
  .kpi-break-label{font-size:11px; color:var(--ink-soft); font-weight:600; margin-bottom:3px;}
  .kpi-break-row{display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;}
  .kpi-break-value{font-size:14.5px; font-weight:700; font-variant-numeric:tabular-nums;}

  /* Segmented control */
  .seg{display:flex; background:#E6E8EE; border-radius:14px; padding:4px; margin-bottom:12px;}
  .seg button{flex:1; font-size:12.5px; font-weight:700; padding:9px 8px; border-radius:11px; border:none; background:transparent; color:var(--ink-soft);}
  .seg button.active{background:#fff; color:var(--navy); box-shadow:0 2px 6px rgba(11,31,68,0.12);}

  /* Chart card */
  .chart-card{background:var(--card); border-radius:var(--radius); padding:16px 14px 10px; box-shadow:0 1px 3px rgba(11,31,68,0.06); margin-bottom:6px;}
  .chart-legend{display:flex; gap:14px; padding:0 4px 8px;}
  .leg-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft); font-weight:600;}
  .leg-dot{width:9px; height:9px; border-radius:50%;}
  .chart-wrap{position:relative; height:220px; margin-top:4px;}
  .daily-foot{display:flex; border-top:1px dashed var(--line); margin-top:10px; padding:12px 4px 4px;}
  .daily-foot > div{flex:1; min-width:0;}
  .daily-foot > div + div{border-left:1px solid var(--line); padding-left:14px; margin-left:14px;}
  .df-label{font-size:11px; font-weight:600; color:var(--ink-soft); margin-bottom:3px;}
  .df-row{display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;}
  .df-val{font-size:14.5px; font-weight:800; font-variant-numeric:tabular-nums;}
  .df-cmp{font-size:10.5px; color:var(--ink-soft); margin-top:3px;}

  /* Bar list */
  .rc-card{background:var(--card); border-radius:var(--radius); box-shadow:0 1px 3px rgba(11,31,68,0.06); padding:16px 16px 12px; margin-bottom:12px;}
  .bar-row{margin-bottom:12px;}
  .bar-row:last-child{margin-bottom:2px;}
  .bar-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; gap:8px;}
  .bar-left{display:flex; align-items:center; gap:8px; min-width:0;}
  .bar-rank{min-width:18px; height:18px; padding:0 4px; border-radius:6px; background:var(--navy); color:#fff; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .bar-name{font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .bar-right{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .bar-val{font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap;}
  .bar-track{height:8px; border-radius:6px; background:var(--navy-soft); overflow:hidden;}
  .bar-fill{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--navy),var(--red)); min-width:4px;}
  .bar-contrib{font-size:10.5px; color:var(--ink-soft); margin-top:4px; text-align:right;}
  .more-btn{display:block; width:100%; margin-top:10px; font-size:12px; font-weight:700; color:var(--navy); background:var(--navy-soft); border:none; padding:9px; border-radius:12px;}
  .empty{font-size:12px; color:var(--ink-soft); text-align:center; padding:16px 0;}

  .data-alert{margin:14px 16px 0; padding:12px 14px; border-radius:14px; background:var(--red-soft); color:var(--red); font-size:12px; font-weight:600; line-height:1.5; border:1px solid #F8C5CF;}
  .data-alert b{font-weight:800;}
  @media (min-width:900px){ .data-alert{margin:16px 0 0;} }
  footer{padding:18px 16px 4px; text-align:center; font-size:10.5px; color:var(--ink-soft);}

  /* Bottom sheet (filter / sort) */
  .overlay{position:fixed; inset:0; background:rgba(11,31,68,0.35); z-index:50; display:none; align-items:flex-end; justify-content:center;}
  .overlay.open{display:flex;}
  .sheet{background:#fff; width:100%; max-width:460px; border-radius:22px 22px 0 0; padding:18px 18px 22px; box-shadow:0 -8px 30px rgba(11,31,68,0.18);}
  .sheet-grip{width:38px; height:4px; border-radius:4px; background:var(--line); margin:0 auto 14px;}
  .sheet-title{font-size:15px; font-weight:800; margin-bottom:4px;}
  .sheet-sub{font-size:11.5px; color:var(--ink-soft); margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:10.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:5px;}
  .field select{width:100%; padding:11px 12px; border-radius:12px; border:1.5px solid var(--line); background:#fff; font-size:13.5px; font-weight:700; color:var(--navy); outline:none; font-family:inherit;}
  .field select:disabled{color:var(--ink-soft); background:var(--navy-soft);}
  .sheet-actions{display:flex; gap:10px; margin-top:6px;}
  .sheet-actions button{flex:1; font-size:13px; font-weight:700; padding:12px; border-radius:12px; border:1.5px solid var(--line); background:#fff; color:var(--ink-soft);}
  .sheet-actions button.primary{background:var(--navy); color:#fff; border-color:var(--navy);}
  .opt-list button{display:flex; justify-content:space-between; align-items:center; width:100%; text-align:left; font-size:13.5px; font-weight:600; color:var(--ink); padding:12px 4px; border:none; border-bottom:1px solid var(--line); background:transparent;}
  .opt-list button:last-child{border-bottom:none;}
  .opt-list button.sel{color:var(--red); font-weight:800;}
  .opt-list button.sel::after{content:"✓";}

  /* Desktop */
  @media (min-width:900px){
    body{background:var(--navy-soft);}
    .app{max-width:1180px; background:transparent; padding:24px 24px 48px;}
    header.top{border-radius:20px; padding:26px 30px 24px;}
    .brand-title{font-size:21px;}
    .subtitle{font-size:13px;}
    .view{display:grid; grid-template-columns:230px 1fr; column-gap:26px; align-items:start;}
    .page-switch{padding:16px 0 0; max-width:420px;}
    nav.tabs{grid-column:1; flex-direction:column; align-items:stretch; position:sticky; top:24px; background:transparent; border-bottom:none; padding:22px 0 0; gap:8px; overflow:visible; align-self:start;}
    nav.tabs button{width:100%; text-align:left; padding:11px 16px; font-size:13px; background:var(--card); box-shadow:0 1px 2px rgba(11,31,68,0.05);}
    nav.tabs button.active{box-shadow:0 4px 10px rgba(11,31,68,0.18);}
    main.content{grid-column:2; min-width:0;}
    section{padding:0 0 8px; margin-top:24px; scroll-margin-top:24px;}
    section:first-of-type{margin-top:22px;}
    .sec-title{font-size:17px;}
    #kpiCards{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
    #kpiCards .kpi-card{margin-bottom:0;}
    .chart-wrap{height:320px;}
    .chart-card{padding:20px 22px 14px;}
    .seg{max-width:100%;}
    .overlay{align-items:center;}
    .sheet{border-radius:22px; max-width:420px;}
    .sheet-grip{display:none;}
  }

  /* ===== Historical-only components (sama dengan Roaming Historical) ===== */
  .period-select-wrap{padding:16px 16px 0;}
  .period-select-label{font-size:11px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:6px;}
  select.period-select{width:100%; padding:11px 14px; border-radius:12px; border:1.5px solid var(--line); background:#fff; font-size:13.5px; font-weight:700; color:var(--navy); outline:none; font-family:inherit;}
  .kpi-extra{display:flex; border-top:1px dashed var(--line); padding:10px 18px 12px; gap:14px;}
  .kpi-extra-item{flex:1; min-width:0;}
  .kpi-extra-label{font-size:9.5px; color:var(--ink-soft); font-weight:700; text-transform:uppercase; letter-spacing:0.3px; margin-bottom:4px;}
  .kpi-extra-row{display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;}
  .kpi-extra-val{font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums;}
  .bar-extra{font-size:10.5px; color:var(--ink-soft); margin-top:3px; text-align:right;}
  .bar-extra b{color:var(--ink); font-weight:700;}
  .leg-line{width:16px; height:0; border-top:2px solid #000; position:relative;}
  .leg-line::after{content:""; position:absolute; left:5px; top:-4px; width:6px; height:6px; border-radius:50%; background:#fff; border:1.5px solid #000;}
  .bar-extra .up{color:var(--pos);} .bar-extra .down{color:var(--neg);}
  .daily-foot > div + div + div{border-left:1px solid var(--line); padding-left:14px; margin-left:14px;}
  @media (min-width:900px){
    .period-select-wrap{padding:22px 0 0; max-width:280px;}
    main.content > section:first-of-type{margin-top:18px;}
  }
</style>
</head>

<!-- Data dimuat dari file terpisah di folder yang sama (selalu versi terbaru / anti-cache):

<script>(function(){ var v = Date.now(); ['digipos_clusters.js', 'digipos_data_monthly.js'].forEach(function (f) { document.write('<script src="' + f + '?v=' + v + '"><\/script>'); }); })();</script>
<script>
if (typeof CLUSTERS === 'undefined' || typeof DATA_MONTHLY === 'undefined') {
  var miss = [typeof CLUSTERS === 'undefined' ? 'digipos_clusters.js' : '', typeof DATA_MONTHLY === 'undefined' ? 'digipos_data_monthly.js' : ''].filter(Boolean).join(' & ');
  document.addEventListener('DOMContentLoaded', function () {
    var el = document.getElementById('dataAlert');
    el.innerHTML = '⚠ File data tidak ditemukan: <b>' + miss + '</b>. Pastikan file ada di folder yang sama dengan dashboard ini dan isinya valid (cek tanda ` pembuka/penutup).';
    el.hidden = false; document.querySelector('.view').style.display = 'none';
  });
  throw new Error('Data file missing: ' + miss);
}

/* ===================== Parser (jangan diubah) ===================== */
const ISSUES = { unknown: {}, badPeriod: 0, badRow: 0, dup: 0, dupRef: [] };
const MON3 = { jan:1,feb:2,mar:3,apr:4,may:5,mei:5,jun:6,jul:7,aug:8,agu:8,agt:8,sep:9,oct:10,okt:10,nov:11,dec:12,des:12 };
function parsePeriod(s) {          // -> YYYYMM atau 0
  s = String(s).trim(); let y, m, x;
  if ((x = s.match(/^(\d{4})[\-\/.](\d{1,2})(?:[\-\/.]\d{1,2})?/))) { y = +x[1]; m = +x[2]; }          // 2026-08 / 2026-08-01
  else if ((x = s.match(/^(\d{4})(\d{2})$/))) { y = +x[1]; m = +x[2]; }                                // 202608
  else if ((x = s.match(/^(\d{1,2})[\-\/.](\d{4})$/))) { y = +x[2]; m = +x[1]; }                       // 08/2026
  else if ((x = s.match(/^(?:\d{1,2}[\s\-\/])?([A-Za-z]{3})[A-Za-z]*[\s\-\/'](\d{2,4})$/))) {          // Aug-2026 / Agustus 2026 / 1-Aug-26
    m = MON3[x[1].toLowerCase()]; y = +x[2] < 100 ? 2000 + +x[2] : +x[2];
  }
  else if ((x = s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})$/))) {                                  // 01/08/2026 atau 8/1/2026
    y = +x[3]; const a = +x[1], b = +x[2];
    m = (a === 1 && b !== 1) ? b : (b === 1 && a !== 1) ? a : (a <= 12 && b > 12) ? a : b;
  }
  else if ((x = s.match(/^(\d{5})(\.\d+)?$/))) {                                                     // Excel serial date
    const dt = new Date(Date.UTC(1899, 11, 30) + +x[1] * 864e5); y = dt.getUTCFullYear(); m = dt.getUTCMonth() + 1;
  }
  else return 0;
  return (y >= 2000 && y <= 2100 && m >= 1 && m <= 12) ? y * 100 + m : 0;
}
const toNum = s => { const v = String(s || '').replace(/[^\d\-]/g, ''); return v ? +v : 0; };
function buildData() {
  const ref = [], byCode = {};
  CLUSTERS.trim().split(/\r?\n/).forEach(line => {
    const p = line.split('|').map(s => s.trim()); if (p.length < 4 || !p[0]) return;
    const k = p[0].toUpperCase();
    if (byCode[k]) { ISSUES.dupRef.push(k); return; }
    const o = { k, rg: p[1], br: p[2], nc: p[3], m: {} };   // m[YYYYMM] = {r (Rp Juta), t, s}
    ref.push(o); byCode[k] = o;
  });
  const seen = {}, periods = new Set();
  DATA_MONTHLY.split(/\r?\n/).forEach(line => {
    if (!line.trim()) return;
    const p = line.split(/\t|\||;/);
    if (/period|periode|bulan/i.test(p[0])) return;
    if (p.length < 5) { ISSUES.badRow++; return; }
    const ym = parsePeriod(p[0]); if (!ym) { ISSUES.badPeriod++; return; }
    const code = p[1].trim().toUpperCase(), o = byCode[code];
    if (!o) { const u = p[1].trim() || '(kosong)'; ISSUES.unknown[u] = (ISSUES.unknown[u] || 0) + 1; return; }
    const key = ym + '|' + code;
    if (seen[key]) ISSUES.dup++;
    seen[key] = 1;
    o.m[ym] = { r: toNum(p[4]) / 1e6, t: toNum(p[3]), s: toNum(p[2]) };   // baris terakhir yang dipakai
    periods.add(ym);
  });
  const used = ref.filter(o => !/^UNK-/.test(o.k) || Object.keys(o.m).length);
  return { ref: used, periods: [...periods].sort((a, b) => a - b) };
}
const BUILT = buildData();
const DATA = BUILT.ref, PERIODS = BUILT.periods;

/* ===================== Helpers ===================== */
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MON_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const yOf = ym => Math.floor(ym / 100), mOf = ym => ym % 100;
const lab = ym => `${MON[mOf(ym)-1]} ${yOf(ym)}`;
const labS = ym => `${MON[mOf(ym)-1]}-${String(yOf(ym)).slice(2)}`;
const prevYm = ym => mOf(ym) === 1 ? (yOf(ym) - 1) * 100 + 12 : ym - 1;
const lyYm = ym => ym - 100;
const dim = ym => new Date(yOf(ym), mOf(ym), 0).getDate();
const yoy = (c, p) => (p > 0 ? (c / p - 1) * 100 : null);
const f1 = n => n.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fId = (n, d = 0) => n.toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d });
function rp(mn) { if (mn == null) return '–'; return Math.abs(mn) >= 1000 ? 'Rp ' + f1(mn / 1000) + ' M' : 'Rp ' + f1(mn) + ' Jt'; }
const rpTs = mn => mn == null ? '–' : 'Rp ' + f1(mn * 1000) + ' rb';
const fN = n => n == null ? '–' : fId(n);            // ticket size: input Rp Juta per trx
function pill(c, p) {
  if (p == null || c == null) return '<span class="yoy flat">–</span>';
  if (!(p > 0)) return c > 0 ? '<span class="yoy pos">New</span>' : '<span class="yoy flat">–</span>';
  const g = yoy(c, p), cls = g >= 0 ? 'pos' : 'neg';
  return `<span class="yoy ${cls}">${g >= 0 ? '▲' : '▼'} ${f1(Math.abs(g))}%</span>`;
}
function pillN(c, p) {   // selisih angka (untuk jumlah cluster)
  if (p == null) return '<span class="yoy flat">–</span>';
  const d = c - p; if (!d) return '<span class="yoy flat">0</span>';
  return `<span class="yoy ${d > 0 ? 'pos' : 'neg'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}</span>`;
}
function pct(c, p) {     // teks berwarna untuk bar-extra
  if (p == null) return '<b>–</b>';
  if (!(p > 0)) return c > 0 ? '<b class="up">New</b>' : '<b>–</b>';
  const g = yoy(c, p); return `<b class="${g >= 0 ? 'up' : 'down'}">${g >= 0 ? '+' : ''}${f1(g)}%</b>`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const ICON_FILTER = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 4h12M4.5 8h7M7 12h2"/></svg>';

function agg(list, ym) {
  const a = { r: 0, t: 0, s: 0, n: 0 };
  for (const o of list) { const v = o.m[ym]; if (v) { a.r += v.r; a.t += v.t; a.s += v.s; if (v.t > 0 && !/^UNK-/.test(o.k)) a.n++; } }
  return a;
}
// sama dengan agg, tapi null kalau periode itu tidak ada di data (mis. tahun pembanding belum tersedia)
const HAS = ym => PERIODS.includes(ym);
const NA = { r: null, t: null, s: null, n: null };
const aggP = (list, ym) => HAS(ym) ? agg(list, ym) : NA;
function aggYtdP(list, ym) { for (let m = 1; m <= mOf(ym); m++) if (!HAS(yOf(ym) * 100 + m)) return NA; return aggYtd(list, ym); }
const tsOf = a => a.t == null ? null : a.t > 0 ? a.r / a.t : 0;
function aggYtd(list, ym) {
  const a = { r: 0, t: 0 }, y = yOf(ym);
  for (let m = 1; m <= mOf(ym); m++) { const x = agg(list, y * 100 + m); a.r += x.r; a.t += x.t; }
  return a;
}
const uniq = arr => [...new Set(arr)];
const REGIONS = uniq(DATA.map(o => o.rg)).sort();
const branchesOf = rg => uniq(DATA.filter(o => !rg || o.rg === rg).map(o => o.br)).sort();
const clustersOf = (rg, br) => DATA.filter(o => (!rg || o.rg === rg) && (!br || o.br === br))
  .map(o => ({ k: o.k, n: o.nc })).sort((a, b) => a.n.localeCompare(b.n));

/* ===================== State ===================== */
const S = {
  ym: PERIODS[PERIODS.length - 1] || 0,
  main: { rg: '', br: '', k: '' },     // filter Score Card + Monthly Trend
  branch: { rg: '' },
  cluster: { rg: '', br: '' },
  sort: 'rev_desc', metric: 'rev',
  showAll: { branch: false, cluster: false },
};
const filterList = f => DATA.filter(o => (!f.rg || o.rg === f.rg) && (!f.br || o.br === f.br) && (!f.k || o.k === f.k));
function scopeLabel(f) {
  if (f.k) return 'Cluster ' + DATA.find(x => x.k === f.k).nc;
  if (f.br) return 'Branch ' + f.br;
  return f.rg || 'Semua Region';
}
function setBtn(id, f) {
  const b = document.getElementById(id);
  b.classList.toggle('on', !!(f.rg || f.br || f.k)); b.innerHTML = ICON_FILTER + 'Filter';
}
const cmpTxt = () => `${lab(S.ym)} vs ${lab(lyYm(S.ym))} (YoY)`;

/* ===================== 1. Score Card ===================== */
function kpiCard(label, value, main, br, ex) {
  const item = (cls, x) => `<div class="${cls}-item"><div class="${cls}-label">${x[0]}</div><div class="${cls}-row"><span class="${cls === 'kpi-break' ? 'kpi-break-value' : 'kpi-extra-val'}">${x[1]}</span>${x[2] || ''}</div></div>`;
  return `<div class="kpi-card">
    <div class="kpi-main"><div><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div></div>${main}</div>
    <div class="stub-divider"></div>
    <div class="kpi-breakdown">${br.map(x => item('kpi-break', x)).join('')}</div>
    <div class="kpi-extra">${ex.map(x => item('kpi-extra', x)).join('')}</div>
  </div>`;
}
function renderScore() {
  const list = filterList(S.main), ym = S.ym, pm = prevYm(ym), ly = lyYm(ym);
  const c = agg(list, ym), p = aggP(list, pm), l = aggP(list, ly), yt = aggYtd(list, ym), yl = aggYtdP(list, ly);
  const ts = tsOf;
  document.getElementById('scoreSub').textContent = `${cmpTxt()} · ${scopeLabel(S.main)}`;
  setBtn('scoreFilterBtn', S.main);
  const D = dim(ym);
  document.getElementById('kpiCards').innerHTML =
    kpiCard('Revenue', rp(c.r), pill(c.r, l.r),
      [['Rata-rata/hari', rp(c.r / D)], [labS(ly), rp(l.r)]],
      [['MoM vs ' + labS(pm), '', pill(c.r, p.r)], [`YTD ${MON[0]}–${MON[mOf(ym)-1]}`, rp(yt.r), pill(yt.r, yl.r)]]) +
    kpiCard('Transactions', fId(c.t), pill(c.t, l.t),
      [['Rata-rata/hari', fId(c.t / D)], [labS(ly), fN(l.t)]],
      [['MoM vs ' + labS(pm), '', pill(c.t, p.t)], [`YTD ${MON[0]}–${MON[mOf(ym)-1]}`, fId(yt.t), pill(yt.t, yl.t)]]) +
    kpiCard('Ticket Size (Rev/Trx)', rpTs(ts(c)), pill(ts(c), ts(l)),
      [[labS(pm), rpTs(ts(p))], [labS(ly), rpTs(ts(l))]],
      [['MoM vs ' + labS(pm), '', pill(ts(c), ts(p))], ['YTD (Rev ÷ Trx)', rpTs(ts(yt)), pill(ts(yt), ts(yl))]]) +
    kpiCard('Cluster Aktif', fId(c.n), pillN(c.n, l.n),
      [[labS(pm), fN(p.n)], [labS(ly), fN(l.n)]],
      [['Rev / cluster aktif', c.n ? rp(c.r / c.n) : '–', pill(c.n ? c.r / c.n : 0, l.n == null ? null : l.n ? l.r / l.n : 0)], ['Total cluster terdaftar', fId(list.filter(o => !/^UNK-/.test(o.k)).length)]]);
}

/* ===================== 2. Monthly Trend ===================== */
let chart;
function renderTrend() {
  const list = filterList(S.main), y = yOf(S.ym), selM = mOf(S.ym);
  setBtn('trendFilterBtn', S.main);
  document.getElementById('trendSub').textContent = `${y} vs ${y-1} · ${scopeLabel(S.main)}`;
  document.getElementById('legLY').textContent = String(y - 1);
  document.getElementById('legTY').textContent = String(y);
  const val = a => S.metric === 'rev' ? a.r : S.metric === 'trx' ? a.t : (a.t > 0 ? a.r / a.t : 0);
  const has = new Set(PERIODS);
  const ty = [], lyArr = [];
  for (let m = 1; m <= 12; m++) {
    ty.push(has.has(y * 100 + m) ? val(agg(list, y * 100 + m)) : null);
    lyArr.push(has.has((y - 1) * 100 + m) ? val(agg(list, (y - 1) * 100 + m)) : null);
  }
  const tick = v => S.metric === 'rev' ? (v >= 1000 ? fId(v / 1000, 1) + ' M' : fId(v, 0) + ' Jt')
                   : S.metric === 'trx' ? fId(v) : fId(v * 1000, 0) + ' rb';
  const tip = v => v == null ? '-' : S.metric === 'rev' ? rp(v) : S.metric === 'trx' ? fId(v) : rpTs(v);
  const tyColors = ty.map((_, i) => i + 1 === selM ? '#E4002B' : 'rgba(228,0,43,0.55)');
  // YoY % per bulan: hanya kalau bulan ini & bulan yang sama tahun lalu sama-sama ada datanya
  const yoyArr = ty.map((v, i) => (v != null && lyArr[i] != null && lyArr[i] > 0) ? (v / lyArr[i] - 1) * 100 : null);
  const fPct = v => (v > 0 ? '+' : '') + fId(v, 1) + '%';
  const ds = [
    { label: String(y - 1), data: lyArr, backgroundColor: '#F4C3CD', borderRadius: 4, maxBarThickness: 22 },
    { label: String(y), data: ty, backgroundColor: tyColors, borderRadius: 4, maxBarThickness: 22, order: 2 },
    { type: 'line', label: 'YoY', data: yoyArr, yAxisID: 'y1', order: 0, borderColor: '#000000', backgroundColor: '#FFFFFF',
      pointBorderColor: '#000000', pointBackgroundColor: '#FFFFFF', borderWidth: 2, pointRadius: 3.5, pointHoverRadius: 5,
      pointBorderWidth: 1.5, cubicInterpolationMode: 'monotone', spanGaps: false },
  ];
  ds[0].order = 1;   // 2025 di kiri, 2026 di kanan, garis YoY paling atas
  if (typeof Chart === 'undefined') { document.querySelector('.chart-wrap').innerHTML = '<div class="empty">Chart tidak dapat dimuat.</div>'; }
  else { if (chart) chart.destroy(); chart = new Chart(document.getElementById('trendChart'), {
    type: 'bar', data: { labels: MON, datasets: ds },
    options: {
      responsive: true, maintainAspectRatio: false, animation: { duration: 300 },
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false },
        tooltip: { backgroundColor: '#0B1F44', padding: 10, callbacks: { label: c => c.dataset.yAxisID === 'y1' ? ` YoY: ${c.raw == null ? '-' : fPct(c.raw)}` : ` ${c.dataset.label}: ${tip(c.raw)}` } } },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#6B7686', font: { size: window.innerWidth < 600 ? 9 : 10 }, maxRotation: 0, autoSkip: false }, border: { color: '#E7E9EE' } },
        y: { beginAtZero: true, grid: { color: '#EEF0F4' }, border: { display: false },
             ticks: { color: '#6B7686', font: { size: 10, weight: '600' }, callback: tick, maxTicksLimit: 7 } },
        y1: { position: 'right', grid: { display: false }, border: { display: false }, grace: '10%',
             ticks: { color: '#000', font: { size: 10, weight: '700' }, callback: v => fId(v, 0) + '%', maxTicksLimit: 7 } },
      },
    },
  }); }
  const yt = aggYtd(list, S.ym), yl = aggYtdP(list, lyYm(S.ym));
  const ts = tsOf;
  document.getElementById('trendFoot').innerHTML = `
    <div><div class="df-label">YTD Revenue ${MON[0]}–${MON[selM-1]}</div>
      <div class="df-row"><span class="df-val">${rp(yt.r)}</span>${pill(yt.r, yl.r)}</div>
      <div class="df-cmp">vs ${y-1}: ${rp(yl.r)}</div></div>
    <div><div class="df-label">YTD Trx</div>
      <div class="df-row"><span class="df-val">${fId(yt.t)}</span>${pill(yt.t, yl.t)}</div>
      <div class="df-cmp">vs ${y-1}: ${fN(yl.t)}</div></div>
    <div><div class="df-label">YTD Ticket Size</div>
      <div class="df-row"><span class="df-val">${rpTs(ts(yt))}</span>${pill(ts(yt), ts(yl))}</div>
      <div class="df-cmp">vs ${y-1}: ${rpTs(ts(yl))}</div></div>`;
}

/* ===================== 3–5. Bar lists ===================== */
function itemStats(list) {
  const ym = S.ym;
  return { c: agg(list, ym), p: aggP(list, prevYm(ym)), l: aggP(list, lyYm(ym)), yt: aggYtd(list, ym), yl: aggYtdP(list, lyYm(ym)) };
}
function barRow(i, name, st, total, note) {
  const share = total > 0 ? st.c.r / total * 100 : 0;
  return `<div class="bar-row">
      <div class="bar-top">
        <div class="bar-left"><span class="bar-rank">${i}</span><span class="bar-name" title="${esc(name)}">${esc(name)}</span></div>
        <div class="bar-right"><span class="bar-val">${rp(st.c.r)}</span>${pill(st.c.r, st.l.r)}</div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100, share).toFixed(2)}%"></div></div>
      <div class="bar-contrib">${f1(share)}% of total revenue${note ? ' · ' + esc(note) : ''}</div>
      <div class="bar-extra">MoM ${pct(st.c.r, st.p.r)} · YTD <b>${rp(st.yt.r)}</b> (${pct(st.yt.r, st.yl.r)} YoY)</div>
    </div>`;
}
const active = st => st.c.r || st.l.r || st.p.r || st.c.t || st.l.t;
const SORTS = {
  rev_desc: { label: 'Revenue tertinggi', fn: (x, y) => y.st.c.r - x.st.c.r },
  rev_asc:  { label: 'Revenue terendah',  fn: (x, y) => x.st.c.r - y.st.c.r },
  yoy_desc: { label: 'YoY tertinggi',     fn: (x, y) => (yoy(y.st.c.r, y.st.l.r) ?? 1e9) - (yoy(x.st.c.r, x.st.l.r) ?? 1e9) },
  yoy_asc:  { label: 'YoY terendah',      fn: (x, y) => (yoy(x.st.c.r, x.st.l.r) ?? 1e9) - (yoy(y.st.c.r, y.st.l.r) ?? 1e9) },
  mom_desc: { label: 'MoM tertinggi',     fn: (x, y) => (yoy(y.st.c.r, y.st.p.r) ?? 1e9) - (yoy(x.st.c.r, x.st.p.r) ?? 1e9) },
  ytd_desc: { label: 'YTD tertinggi',     fn: (x, y) => y.st.yt.r - x.st.yt.r },
  name:     { label: 'Kode region (01–12)', fn: (x, y) => x.name.localeCompare(y.name) },
};
function renderRegion() {
  const total = agg(DATA, S.ym).r;
  const items = REGIONS.map(rg => ({ name: rg, st: itemStats(DATA.filter(o => o.rg === rg)) })).filter(x => active(x.st)).sort(SORTS[S.sort].fn);
  document.getElementById('regionSub').textContent = `${cmpTxt()} · ${items.length} region`;
  const b = document.getElementById('regionSortBtn'); b.innerHTML = ICON_FILTER + 'Urutkan'; b.classList.toggle('on', S.sort !== 'rev_desc');
  document.getElementById('regionBars').innerHTML = items.length ? items.map((x, i) => barRow(i + 1, x.name, x.st, total)).join('') : '<div class="empty">Tidak ada data.</div>';
}
function topList(elId, kind, items, total) {
  const el = document.getElementById(elId);
  if (!items.length) { el.innerHTML = '<div class="empty">Tidak ada data untuk filter ini.</div>'; return; }
  const all = S.showAll[kind], shown = all ? items : items.slice(0, 10);
  let h = shown.map((x, i) => barRow(i + 1, x.name, x.st, total, x.note)).join('');
  if (items.length > 10) h += `<button class="more-btn" data-more="${kind}">${all ? 'Tampilkan Top 10' : `Tampilkan semua (${items.length})`}</button>`;
  el.innerHTML = h;
}
function renderBranch() {
  const f = S.branch, total = agg(DATA, S.ym).r;
  const items = branchesOf(f.rg).map(br => { const list = DATA.filter(o => o.br === br && (!f.rg || o.rg === f.rg)); return { name: br, st: itemStats(list), note: list[0].rg }; })
    .filter(x => active(x.st)).sort((x, y) => y.st.c.r - x.st.c.r);
  document.getElementById('branchSub').textContent = `${cmpTxt()}${f.rg ? ' · ' + f.rg : ''}`;
  setBtn('branchFilterBtn', f);
  topList('branchBars', 'branch', items, total);
}
function renderCluster() {
  const f = S.cluster, total = agg(DATA, S.ym).r;
  const items = DATA.filter(o => (!f.rg || o.rg === f.rg) && (!f.br || o.br === f.br))
    .map(o => ({ name: o.nc, st: itemStats([o]), note: `${o.br} · ${o.rg}` })).filter(x => active(x.st)).sort((x, y) => y.st.c.r - x.st.c.r);
  document.getElementById('clusterSub').textContent = `${cmpTxt()}${f.br ? ' · ' + f.br : f.rg ? ' · ' + f.rg : ''}`;
  setBtn('clusterFilterBtn', f);
  topList('clusterBars', 'cluster', items, total);
}

/* ===================== Sheet (filter & sort) ===================== */
const overlay = document.getElementById('overlay'), sheet = document.getElementById('sheet');
let draft = null, sheetKind = null;
const LEVELS = { main: ['rg', 'br', 'k'], branch: ['rg'], cluster: ['rg', 'br'] };
function opt(v, t, sel) { return `<option value="${esc(v)}"${v === sel ? ' selected' : ''}>${esc(t)}</option>`; }
function drawFilterSheet() {
  const lv = LEVELS[sheetKind];
  const titles = { main: 'Filter Score Card & Monthly Trend', branch: 'Filter Branch', cluster: 'Filter Cluster' };
  let h = `<div class="sheet-grip"></div><div class="sheet-title">${titles[sheetKind]}</div>
    <div class="sheet-sub">Pilih wilayah. Kontribusi tetap dihitung terhadap total nasional.</div>`;
  h += `<div class="field"><label>Region</label><select data-f="rg">${opt('', 'Semua Region', draft.rg)}${REGIONS.map(r => opt(r, r, draft.rg)).join('')}</select></div>`;
  if (lv.includes('br')) h += `<div class="field"><label>Branch</label><select data-f="br">${opt('', 'Semua Branch', draft.br)}${branchesOf(draft.rg).map(b => opt(b, b, draft.br)).join('')}</select></div>`;
  if (lv.includes('k')) h += `<div class="field"><label>Cluster</label><select data-f="k">${opt('', 'Semua Cluster', draft.k)}${clustersOf(draft.rg, draft.br).map(c => opt(c.k, c.n, draft.k)).join('')}</select></div>`;
  h += `<div class="sheet-actions"><button data-act="reset">Reset</button><button class="primary" data-act="apply">Terapkan</button></div>`;
  sheet.innerHTML = h;
}
function drawSortSheet() {
  sheet.innerHTML = `<div class="sheet-grip"></div><div class="sheet-title">Urutkan Region</div>
    <div class="sheet-sub">Periode ${lab(S.ym)}.</div>
    <div class="opt-list">${Object.entries(SORTS).map(([k, v]) => `<button data-sort="${k}" class="${k === S.sort ? 'sel' : ''}">${v.label}</button>`).join('')}</div>`;
}
function openSheet(kind) {
  sheetKind = kind;
  if (kind === 'sort') drawSortSheet(); else { draft = { rg: '', br: '', k: '', ...S[kind] }; drawFilterSheet(); }
  overlay.classList.add('open');
}
const closeSheet = () => overlay.classList.remove('open');
overlay.addEventListener('click', e => { if (e.target === overlay) closeSheet(); });
sheet.addEventListener('change', e => {
  const f = e.target.dataset.f; if (!f) return;
  draft[f] = e.target.value;
  if (f === 'rg') { draft.br = ''; draft.k = ''; }
  if (f === 'br') { draft.k = ''; if (draft.br && !draft.rg) draft.rg = DATA.find(o => o.br === draft.br).rg; }
  if (f === 'k' && draft.k) { const o = DATA.find(x => x.k === draft.k); draft.rg = o.rg; draft.br = o.br; }
  drawFilterSheet();
});
sheet.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.sort) { S.sort = t.dataset.sort; renderRegion(); closeSheet(); return; }
  if (t.dataset.act === 'reset') { draft = { rg: '', br: '', k: '' }; drawFilterSheet(); return; }
  if (t.dataset.act === 'apply') {
    S[sheetKind] = Object.fromEntries(LEVELS[sheetKind].map(k => [k, draft[k] || '']));
    if (sheetKind === 'main') { renderScore(); renderTrend(); }
    if (sheetKind === 'branch') { S.showAll.branch = false; renderBranch(); }
    if (sheetKind === 'cluster') { S.showAll.cluster = false; renderCluster(); }
    closeSheet();
  }
});
document.querySelectorAll('[data-sheet]').forEach(b => b.addEventListener('click', () => openSheet(b.dataset.sheet)));
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ===================== Wiring ===================== */
const sel = document.getElementById('periodSelect');
uniq(PERIODS.map(yOf)).sort((a, b) => b - a).forEach(y => {
  const g = document.createElement('optgroup'); g.label = String(y);
  PERIODS.filter(p => yOf(p) === y).sort((a, b) => b - a).forEach(p => {
    const o = document.createElement('option'); o.value = p; o.textContent = `${MON_ID[mOf(p)-1]} ${y}`; g.appendChild(o);
  });
  sel.appendChild(g);
});
sel.value = S.ym;
sel.addEventListener('change', () => { S.ym = +sel.value; S.showAll = { branch: false, cluster: false }; renderAll(); });
document.getElementById('trendSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  S.metric = b.dataset.m;
  document.querySelectorAll('#trendSeg button').forEach(x => x.classList.toggle('active', x === b));
  renderTrend();
});
document.querySelector('main.content').addEventListener('click', e => {
  const b = e.target.closest('[data-more]'); if (!b) return;
  const k = b.dataset.more; S.showAll[k] = !S.showAll[k]; k === 'branch' ? renderBranch() : renderCluster();
});
const tabs = document.querySelectorAll('#tabs button');
tabs.forEach(b => b.addEventListener('click', () => document.getElementById(b.dataset.target).scrollIntoView({ behavior: 'smooth', block: 'start' })));
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(ents => ents.forEach(en => {
    if (en.isIntersecting) tabs.forEach(t => {
      const on = t.dataset.target === en.target.id; t.classList.toggle('active', on);
      if (on && window.innerWidth < 900) t.parentNode.scrollTo({ left: t.offsetLeft - 14, behavior: 'smooth' });
    });
  }), { rootMargin: '-35% 0px -60% 0px' });
  document.querySelectorAll('main section').forEach(s => io.observe(s));
}

(function showIssues() {
  const u = Object.keys(ISSUES.unknown), msg = [];
  if (!PERIODS.length) msg.push('<b>DATA_MONTHLY kosong</b> — belum ada baris data yang terbaca.');
  if (u.length) msg.push(`<b>${u.length} kode cluster tidak dikenal</b> (datanya belum dihitung): ${u.map(esc).join(', ')}. Cek kode atau tambahkan ke clusters.js.`);
  if (ISSUES.dupRef.length) msg.push(`<b>Kode dobel di clusters.js</b>: ${ISSUES.dupRef.map(esc).join(', ')} — hanya baris pertama yang dipakai.`);
  if (ISSUES.badPeriod) msg.push(`<b>${ISSUES.badPeriod} baris</b> periodenya tidak terbaca.`);
  if (ISSUES.badRow) msg.push(`<b>${ISSUES.badRow} baris</b> kolomnya kurang dari 5.`);
  if (ISSUES.dup) msg.push(`${ISSUES.dup} baris dobel (periode + kode cluster sama) — dipakai baris terakhir.`);
  // bulan yang bolong di tengah rentang data
  if (PERIODS.length > 1) {
    const gaps = []; let p = PERIODS[0];
    while (p < PERIODS[PERIODS.length - 1]) { p = mOf(p) === 12 ? (yOf(p) + 1) * 100 + 1 : p + 1; if (!PERIODS.includes(p)) gaps.push(lab(p)); }
    if (gaps.length) msg.push(`Belum ada data untuk: ${gaps.join(', ')}.`);
  }
  if (msg.length) { const el = document.getElementById('dataAlert'); el.innerHTML = '⚠ Cek data: ' + msg.join('<br>'); el.hidden = false; console.warn('DigiPOS data issues', ISSUES); }
})();

function renderAll() {
  if (!S.ym) return;
  document.getElementById('periodChip').textContent = `Data s.d. ${lab(PERIODS[PERIODS.length - 1])}`;
  renderScore(); renderTrend(); renderRegion(); renderBranch(); renderCluster();
}
document.getElementById('footNote').textContent =
  `Data DigiPOS bulanan ${PERIODS.length ? lab(PERIODS[0]) + ' – ' + lab(PERIODS[PERIODS.length - 1]) : ''} · Revenue dalam Rupiah · YoY vs bulan yang sama tahun sebelumnya · YTD = Januari s.d. bulan terpilih`;
renderAll();
</script>
</body>
